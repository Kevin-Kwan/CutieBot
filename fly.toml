# CutieBot v3 — Fly.io worker (no HTTP service: this is a persistent
# gateway bot, not a web app). See https://fly.io/docs/reference/configuration/

app = "cutiebot"
primary_region = "atl"

# A gateway bot must never be auto-stopped: it holds a persistent
# Discord websocket connection.
auto_stop_machines = false

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
